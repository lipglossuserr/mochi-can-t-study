# backend/src/main/resources/application.properties
spring.application.name=mochi-backend
spring.profiles.active=local

# Firebase
firebase.credentials.path=firebase/serviceAccountKey.json


# CORS
# Pattern-based so Vite's auto-incrementing dev port
# (5173, 5174, ...) doesn't break requests.
mochi.cors.allowed-origins=http://localhost:*


# =========================================================
# MySQL
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/mochi_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234


# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


# =========================================================
# Flyway
# =========================================================
spring.flyway.enabled=true


# =========================================================
# Flashcards - File Upload
# =========================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB


# =========================================================
# Flashcards - AI (Hugging Face is @Primary; Groq stays wired as a
# fallback — see HuggingFaceFlashcardGenerationClient's javadoc for
# how to switch back)
# =========================================================
mochi.ai.huggingface.api-key=${HF_TOKEN:}
mochi.ai.huggingface.model=meta-llama/Llama-3.1-8B-Instruct

mochi.ai.openai.api-key=${GROQ_API_KEY:}
mochi.ai.openai.model=llama-3.3-70b-versatile